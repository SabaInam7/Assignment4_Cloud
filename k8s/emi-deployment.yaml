apiVersion: apps/v1
kind: Deployment
metadata:
  name: emi-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emi
  template:
    metadata:
      labels:
        app: emi
    spec:
      containers:
        - name: emi-container
          image: emi-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000

