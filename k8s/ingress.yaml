apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emi-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: emi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emi-web
                port:
                  number: 80
