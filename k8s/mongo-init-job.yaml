apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7
          command:
            - mongosh
            - --host
            - mongo-0.mongo:27017
            - --quiet
            - --eval
            - |
              try {
                rs.status();
                print("Replica set already initialized");
              } catch (e) {
                rs.initiate({
                  _id: "rs0",
                  members: [
                    {_id: 0, host: "mongo-0.mongo:27017"},
                    {_id: 1, host: "mongo-1.mongo:27017"},
                    {_id: 2, host: "mongo-2.mongo:27017"}
                  ]
                });
              }
