
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Loan EMI Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f4f9;
        }

        .main-card {
            max-width: 850px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .result-panel {
            background: #eaf4ff;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="main-card">

        <h2 class="text-center mb-4">Loan EMI Calculator</h2>

        <form id="emiForm">

            <div class="mb-3">
                <label class="form-label">Loan Amount (P)</label>
                <input type="number" class="form-control"
                       id="amount" min="0.01" step="any" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" class="form-control"
                       id="rate" min="0.01" step="any" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tenure (Months)</label>
                <input type="number" class="form-control"
                       id="months" min="1" step="1" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Calculate EMI
            </button>

        </form>

        <div id="error" class="alert alert-danger mt-3" style="display:none"></div>

        <div id="result" class="result-panel mt-4" style="display:none">

            <h4>Calculation Result</h4>

            <p>Monthly EMI: <strong id="emi"></strong></p>
            <p>Total Payment: <strong id="totalPayment"></strong></p>
            <p>Total Interest: <strong id="totalInterest"></strong></p>
            <p>Served By: <strong id="servedBy"></strong></p>
            <p>Pod IP Address: <strong id="ipAddress"></strong></p>

        </div>

        <hr class="my-4">

        <h4 class="mb-3">Calculation History (Last 10)</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Principal</th>
                        <th>Rate (%)</th>
                        <th>Months</th>
                        <th>EMI</th>
                        <th>Served By</th>
                    </tr>
                </thead>

                <tbody id="history"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>

</body>
</html>
